<title>ZONE — King Model</title>
<style>
:root{
  --bg:#070707; --card:#111111; --line:rgba(255,255,255,.11);
  --text:#f4f1ea; --muted:#969696; --gold:#d9d0bd;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh; display:flex; justify-content:center; overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,255,255,.065), transparent 32%),
    radial-gradient(circle at 15% 80%, rgba(255,255,255,.025), transparent 25%),
    #070707;
}
.page{width:min(100%,520px);padding:38px 20px 30px;position:relative}
.glow{position:fixed;inset:auto 50% -180px auto;width:420px;height:420px;transform:translateX(50%);background:rgba(220,210,190,.045);filter:blur(70px);pointer-events:none}
.brand{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  animation:rise .7s ease both;
}
.logo-wrap{
  width:min(88vw,390px); aspect-ratio:1.5/1; display:flex;align-items:center;justify-content:center;
  margin:-10px auto -2px; overflow:hidden;
}
.logo-wrap img{width:100%;height:100%;object-fit:contain;filter:contrast(1.05)}
.kicker{font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:#aaa;margin-top:0}
.title{font-size:28px;letter-spacing:.22em;font-weight:650;margin:7px 0 4px}
.subtitle{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#777}
.divider{width:46px;height:1px;background:var(--gold);opacity:.55;margin:19px auto 24px}
.links{display:grid;gap:12px}
.link{
  position:relative;display:flex;align-items:center;gap:15px;min-height:64px;
  padding:12px 18px;border:1px solid var(--line);border-radius:18px;
  color:var(--text);text-decoration:none;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  box-shadow:0 10px 28px rgba(0,0,0,.24);backdrop-filter:blur(12px);
  transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease;
}
.link:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.24);background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));box-shadow:0 15px 35px rgba(0,0,0,.35)}
.link:active{transform:scale(.985)}
.icon{
  width:39px;height:39px;border:1px solid rgba(255,255,255,.12);border-radius:13px;
  display:grid;place-items:center;flex:0 0 auto;background:rgba(255,255,255,.045)
}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:14px;font-weight:650;letter-spacing:.06em}
.small{display:block;color:#777;font-size:10px;font-weight:450;letter-spacing:.08em;margin-top:3px}
.arrow{margin-left:auto;color:#777;font-size:18px;transition:transform .2s ease}
.link:hover .arrow{transform:translateX(3px);color:#bbb}
.primary{border-color:rgba(218,208,189,.28);background:linear-gradient(145deg,rgba(218,208,189,.14),rgba(255,255,255,.035))}
.primary .icon{background:rgba(218,208,189,.10);color:#e8dfcf}
.footer{text-align:center;color:#565656;font-size:9px;letter-spacing:.25em;text-transform:uppercase;margin:28px 0 4px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.links .link{opacity:0;animation:rise .55s ease forwards}
.links .link:nth-child(1){animation-delay:.08s}.links .link:nth-child(2){animation-delay:.14s}
.links .link:nth-child(3){animation-delay:.20s}.links .link:nth-child(4){animation-delay:.26s}
.links .link:nth-child(5){animation-delay:.32s}.links .link:nth-child(6){animation-delay:.38s}
@media (max-width:380px){.page{padding-left:15px;padding-right:15px}.title{font-size:24px}.link{min-height:60px}}
</style>
</head>
